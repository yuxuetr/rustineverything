[package]
name = "app"
version = "0.1.0"
authors = ["yuxuetr <54.yeying@gmail.com>"]
edition = "2021"
build = "build.rs"

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack", "html"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# 核心库在前端不需要 server 特性
app-core = { path = "../core" }
widgets = { path = "../widgets" }
dioxus-shadcn = { workspace = true, features = ["badge", "button", "card", "dialog", "dropdown", "input", "sheet", "spinner", "table", "tabs", "textarea"] }
module-blog = { path = "../modules/blog" }
module-podcast = { path = "../modules/podcast" }
module-course = { path = "../modules/course", optional = true }
module-forum = { path = "../modules/forum", optional = true }
module-admin = { path = "../modules/admin", optional = true }
module-search = { path = "../modules/search" }
module-cases = { path = "../modules/cases" }
module-docs = { path = "../modules/docs" }
module-comments = { path = "../modules/comments", optional = true }
module-uploads = { path = "../modules/uploads", optional = true }
module-embedded = { path = "../modules/embedded" }
module-ai = { path = "../modules/ai" }
module-web3 = { path = "../modules/web3" }
module-wasm = { path = "../modules/wasm" }
module-cli = { path = "../modules/cli" }
board = { path = "../board" }
pulldown-cmark = "0.13.0"
chrono = { workspace = true, features = ["serde"] }

# 将以下依赖设为可选，仅供后端使用
tokio = { workspace = true, features = ["full"], optional = true }
axum = { version = "0.8", optional = true }
dotenvy = { version = "0.15", optional = true }
base64 = "0.22"
oauth2 = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"], optional = true }
sea-orm = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
migration = { path = "../migration", optional = true }

[features]
default = ["web", "payments"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# 功能分层（docs/FEATURE_TIERS.md）：默认 = 完整站点。
# 账号层：登录、论坛、博客评论、图片上传、管理后台；需要 Postgres 与 JWT_SECRET。
# 关闭时（basic）不连库、不要求 JWT_SECRET，相关路由 404。
accounts = ["dep:module-forum", "dep:module-comments", "dep:module-admin", "dep:module-uploads"]
# 课程层：课程 / 课时 / 标注 / 权益后台 / Pro 会员。关闭时课程路由 404。
course = ["accounts", "dep:module-course"]
# 在线支付（PM4，默认开）：级联 module-course/payments。关闭时 /api/pay/* 不注册、
# 购买 UI / 我的订单退化，权益仍可由 admin 手动授予。
payments = ["course", "module-course/payments"]
# 仅在 server 特性开启时，激活后端依赖和 core 的 server 特性
server = [
    "dioxus/server",
    "app-core/server",
    "widgets/server",
    "module-blog/server",
    "module-podcast/server",
    "module-course?/server",
    "module-forum?/server",
    "module-admin?/server",
    "module-search/server",
    "module-cases/server",
    "module-docs/server",
    "module-comments?/server",
    "module-uploads?/server",
    "module-embedded/server",
    "module-ai/server",
    "module-web3/server",
    "module-wasm/server",
    "module-cli/server",
    "board/server",
    "dep:tokio",
    "dep:axum",
    "dep:dotenvy",
    "dep:oauth2",
    "dep:tower-http",
    "dep:sea-orm",
    "dep:serde_yaml",
    "dep:rand",
    "dep:tracing-subscriber",
    "dep:migration",
]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
