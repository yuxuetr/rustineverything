[package]
name = "app"
version = "0.1.0"
authors = ["yuxuetr <54.yeying@gmail.com>"]
edition = "2021"
build = "build.rs"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack", "html"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# 核心库在前端不需要 server 特性
app-core = { path = "../core" }
widgets = { path = "../widgets" }
module-blog = { path = "../modules/blog" }
module-podcast = { path = "../modules/podcast" }
module-course = { path = "../modules/course" }
module-forum = { path = "../modules/forum" }
module-admin = { path = "../modules/admin" }
module-search = { path = "../modules/search" }
module-cases = { path = "../modules/cases" }
module-docs = { path = "../modules/docs" }
module-comments = { path = "../modules/comments" }
module-uploads = { path = "../modules/uploads" }
module-embedded = { path = "../modules/embedded" }
module-ai = { path = "../modules/ai" }
module-web3 = { path = "../modules/web3" }
module-wasm = { path = "../modules/wasm" }
module-cli = { path = "../modules/cli" }
pulldown-cmark = "0.13.0"
chrono = { workspace = true, features = ["serde"] }

# 将以下依赖设为可选，仅供后端使用
tokio = { workspace = true, features = ["full"], optional = true }
axum = { version = "0.8", optional = true }
dotenvy = { version = "0.15", optional = true }
base64 = "0.22"
oauth2 = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
sea-orm = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
migration = { path = "../migration", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# 仅在 server 特性开启时，激活后端依赖和 core 的 server 特性
server = [
    "dioxus/server",
    "app-core/server",
    "widgets/server",
    "module-blog/server",
    "module-podcast/server",
    "module-course/server",
    "module-forum/server",
    "module-admin/server",
    "module-search/server",
    "module-cases/server",
    "module-docs/server",
    "module-comments/server",
    "module-uploads/server",
    "module-embedded/server",
    "module-ai/server",
    "module-web3/server",
    "module-wasm/server",
    "module-cli/server",
    "dep:tokio",
    "dep:axum",
    "dep:dotenvy",
    "dep:oauth2",
    "dep:tower-http",
    "dep:sea-orm",
    "dep:serde_yaml",
    "dep:rand",
    "dep:tracing-subscriber",
    "dep:migration",
]

[dev-dependencies]
tempfile = "3"
