[package]
name = "app-core"
version = "0.1.0"
authors = ["yuxuetr <54.yeying@gmail.com>"]
edition = "2021"

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true, optional = true, features = ["fullstack"] }
tokio = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
wasmi.workspace = true
sea-orm = { workspace = true, optional = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
chrono = { workspace = true, features = ["serde"] }
sdk = { path = "../sdk" }
serde_yaml = { workspace = true }
oauth2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
server = ["dep:dioxus", "dep:tokio", "dep:sea-orm", "dep:oauth2", "dep:reqwest", "dep:sha2", "dep:base64", "dep:rand", "dep:jsonwebtoken", "dep:aes-gcm"]

[dev-dependencies]
tempfile = "3"
# Phase 9.2: 测试时用 WAT 文本构造小 wasm 验证 import scan / manifest 一致性。
wat = "1"
# 仅用于 live-DB 集成测试（#[ignore]）：在测试库上跑真实 schema 迁移。
# migration crate 不依赖 core，故无依赖环。
migration = { path = "../migration" }
