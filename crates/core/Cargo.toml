[package]
name = "rustineverything-core"
version = "0.1.0"
authors = ["yuxuetr <54.yeying@gmail.com>"]
edition = "2021"

[dependencies]
tokio = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
wasmi.workspace = true
sea-orm = { workspace = true, optional = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
chrono = { workspace = true, features = ["serde"] }
rustineverything-sdk = { path = "../sdk" }
oauth2 = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.9", optional = true }

[features]
server = ["dep:tokio", "dep:sea-orm", "dep:oauth2", "dep:reqwest", "dep:sha2", "dep:base64", "dep:rand"]
