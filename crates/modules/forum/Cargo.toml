[package]
name = "module-forum"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "router"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["full"], optional = true }
sdk = { path = "../../sdk" }
widgets = { path = "../../widgets" }
module-blog = { path = "../blog" }
module-course = { path = "../course" }
app-core = { path = "../../core" }
module-moderation = { path = "../moderation", optional = true }
sea-orm = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:sea-orm",
    "widgets/server",
    "module-blog/server",
    "module-course/server",
    "app-core/server",
    "dep:module-moderation",
]
