[package]
name = "module-course"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "router"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["full"], optional = true }
sdk = { path = "../../sdk" }
widgets = { path = "../../widgets" }
module-blog = { path = "../blog" }
app-core = { path = "../../core" }
# 购买二维码渲染（client + server 均可用，纯 Rust → SVG）
fast_qr = { version = "0.13", default-features = false, features = ["svg"] }
module-moderation = { path = "../moderation", optional = true }
sea-orm = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
# 支付：网关实现（签名/验签/解密/下单/回调解析）已抽到 module-payment（PM2）。
# web 目标只编译其中立类型与 trait；server 实现经下方 feature 级联开启。
module-payment = { path = "../payment" }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:serde_yaml",
    "dep:sea-orm",
    "dep:rand",
    "module-payment/server",
    "widgets/server",
    "module-blog/server",
    "app-core/server",
    "dep:module-moderation",
]
