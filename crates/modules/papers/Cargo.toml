[package]
name = "module-papers"
version = "0.1.0"
edition = "2021"
description = "论文资讯：HF Daily Papers 选题，读 arXiv 全文生成带出处的多语言解读"

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "router"] }
dioxus-shadcn = { workspace = true, features = ["badge", "empty", "spinner"] }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, features = ["serde"] }
app-core = { path = "../../core" }
widgets = { path = "../../widgets" }
sea-orm = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
server = [
    "dioxus/server",
    "dep:sea-orm",
    "app-core/server",
    "widgets/server",
]
