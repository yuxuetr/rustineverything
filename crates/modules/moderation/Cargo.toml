[package]
name = "module-moderation"
version = "0.1.0"
edition = "2021"
description = "LLM 审核流水线：URL 黑名单 + 内置 LLM 审核 stage（经 crates/llm 调用）"

# Server-only：依赖真实 HTTP + tokio。
# 调用方按需在自己的 server feature 下显式启用。

[lib]
name = "module_moderation"

[dependencies]
async-trait = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }

# 工作区内的依赖：
# - core::engines::moderation 提供 Verdict / ModerationLabel / ModerationThresholds
# - core::entities::moderation_queue 提供入队 entity
# - llm 提供 LlmClient + LlmMessage / LlmRole
# - sdk 提供共享数据类型 (ModerationSubmission / ImageRef)
app-core = { path = "../../core", features = ["server"] }
llm = { path = "../../llm" }
sdk = { path = "../../sdk" }

[dev-dependencies]
mockito = "1.5"
dotenvy = "0.15"
migration = { path = "../../migration" }
