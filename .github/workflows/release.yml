# 阶段 V：发布镜像到 ghcr，cu 上 `docker compose pull` 后重启（cu 内存不够在本机编译）。
# 打 `v*` tag 或手动触发。app 镜像是 accounts 档（无课程与支付），只含框架与示例内容，
# 正式内容由 compose 运行时只读挂载私有内容仓库。

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            build-args: APP_FEATURES=--no-default-features --features accounts
          - name: gateway
            context: crates/gateway
            file: crates/gateway/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rie-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
