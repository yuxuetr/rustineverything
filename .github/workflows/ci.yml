# Phase 7.4.3：持续集成。
#
# 设计原则：
# - 主门禁是 test + build。fmt 与 clippy 当前仅报告（codebase 还在收敛中），
#   未来达到 0-warning 时切换为 `-D warnings` 强校验。
# - `.cargo/config.toml::build.target-dir = /Users/hal/.target` 是开发者本地
#   路径，CI 不可写。这里通过 `CARGO_TARGET_DIR: target` env 覆盖，让 cargo
#   写到 GitHub Runner 工作目录下。
# - Swatinem/rust-cache 用 hash 决定缓存命中，PR 上能跳过完整重编译。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 默认 token 仅需读：限定权限以减少潜在攻击面。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 覆盖 .cargo/config.toml 中的开发者本地路径，让 CI 走默认 target/。
  CARGO_TARGET_DIR: target
  # 降低 cargo update / 依赖解析的网络抖动影响（默认 30s 太短）。
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 当前 codebase 含历史 4-space 文件未统一；先以 report-only 形式
      # 给 PR 作者可见性，避免阻塞合并。后续 PR 完成全量 reformat 后改
      # 为强校验（去掉 `continue-on-error`）。
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-server
      # 当前 codebase 含 ~130 个 warning（多数来自插件 unused 占位 / 测试模板）；
      # 与 fmt 同理：先报告再收敛。0-warning 后改为 `-- -D warnings`。
      - name: cargo clippy --features server --workspace
        continue-on-error: true
        run: cargo clippy --features server --workspace --all-targets

  test:
    name: Test (server feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-server
      # 项目约定（Todos.md / scripts/）：`--test-threads=1` 避免全局
      # registry / DB 单例并发污染。
      - name: cargo test --features server --workspace
        run: cargo test --features server --workspace -- --test-threads=1

  build-server:
    name: Build (server feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-server
      # 仅 check 而非完整 build，CI 速度更快；产物的最终编译由部署管线负责。
      - name: cargo check --features server -p rustineverything-app
        run: cargo check --features server -p rustineverything-app

  build-wasm-plugins:
    name: Build wasm plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-wasm
      # 复用项目脚本：自动 add target + 用 CARGO_TARGET_DIR 编译 +
      # 拷贝 wasm 到 assets/plugins/。CI 上覆盖 .cargo/config.toml 路径
      # 后，wasm 落到 target/wasm32-unknown-unknown/release/ 中。
      - name: build-themes script
        run: bash scripts/build_themes.sh
      # 同时把示例插件 (Phase 5.2.1) 编译到 wasm 验证 SDK 接口仍然兼容。
      - name: cargo build --release plugin-theme-purple
        run: cargo build -p plugin-theme-purple --target wasm32-unknown-unknown --release
