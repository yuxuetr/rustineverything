[workspace]
members = [
    "crates/core",
    "crates/sdk",
    "crates/modules/blog",
    "crates/modules/podcast",
    "crates/modules/course",
    "crates/modules/forum",
    "crates/modules/admin",
    "crates/modules/search",
    "crates/modules/cases",
    "crates/modules/docs",
    "crates/app",
    "crates/plugins/i18n-fluent",
    "crates/plugins/theme-ocean",
    "crates/plugins/github-auth",
    "crates/plugins/google-auth",
    "crates/plugins/discord-auth",
    "crates/plugins/twitter-auth",
]
resolver = "2"

[workspace.dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmi = "0.40.0"
sea-orm = { version = "1.1.4", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
oauth2 = { version = "5.0.0", features = ["reqwest"] }
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
pulldown-latex = "0.7.1"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"
tantivy = "0.26"
tantivy-jieba = "0.19"
aes-gcm = "0.10"
